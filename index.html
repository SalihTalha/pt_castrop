<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGMG Castrop-Rauxel Merkez Camii Namaz Vakitleri</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="screen">
  <img id="backdrop" alt="">

  <div class="panel" id="topbar">
    <div id="logo-box"><img id="logo" src="logo.png" alt=""></div>
    <div id="brand">
      <div id="mosque-name"><span class="fit" id="mosque-name-text">IGMG Castrop-Rauxel Merkez Camii</span></div>
      <div id="location"><span class="fit" id="location-text">Castrop-Rauxel, Almanya</span></div>
    </div>
    <div id="title">
      <div id="title-main"><span class="fit" id="title-text">Namaz Vakitleri</span></div>
    </div>
    <div id="logo2-box"><img id="logo2" alt=""></div>
  </div>

  <div class="panel prayer" id="prayer-imsak"><span class="prayer-name"><span class="fit" id="name-imsak">İmsak</span></span><span class="prayer-sub" id="sabah-line"><span class="fit" id="sabah-text"></span></span><span class="prayer-time" id="time-imsak">--:--</span></div>
  <div class="panel prayer" id="prayer-gunes"><span class="prayer-name"><span class="fit" id="name-gunes">Güneş</span></span><span class="prayer-time" id="time-gunes">--:--</span></div>
  <div class="panel prayer" id="prayer-ogle"><span class="prayer-name"><span class="fit" id="name-ogle">Öğle</span></span><span class="prayer-time" id="time-ogle">--:--</span></div>
  <div class="panel prayer" id="prayer-ikindi"><span class="prayer-name"><span class="fit" id="name-ikindi">İkindi</span></span><span class="prayer-time" id="time-ikindi">--:--</span></div>
  <div class="panel prayer" id="prayer-aksam"><span class="prayer-name"><span class="fit" id="name-aksam">Akşam</span></span><span class="prayer-time" id="time-aksam">--:--</span></div>
  <div class="panel prayer" id="prayer-yatsi"><span class="prayer-name"><span class="fit" id="name-yatsi">Yatsı</span></span><span class="prayer-time" id="time-yatsi">--:--</span></div>

  <div class="panel" id="clock-panel">
    <div class="stack" id="clock-stack">
      <div class="label"><span class="fit" id="clock-title">Saat</span></div>
      <div id="clock">--:--:--</div>
      <div id="date"><span class="fit" id="date-text">&nbsp;</span></div>
      <div id="hijri"><span class="fit" id="hijri-text">&nbsp;</span></div>
    </div>
  </div>

  <div class="panel" id="weather-panel">
    <div class="stack" id="weather-stack">
      <div class="label"><span class="fit" id="weather-title">Hava Durumu</span></div>
      <div id="weather-temp">--,- °C</div>
      <div id="weather-label"><span class="fit" id="weather-label-text">&nbsp;</span></div>
    </div>
  </div>

  <div class="panel" id="hadith-panel">
    <div id="hadith-title"><span class="fit" id="hadith-title-text">Hadis-i Şerif</span></div>
    <div id="hadith-body">
      <div id="hadith-cell">
        <div id="hadith-wrap"><span id="hadith-text"></span> <span id="hadith-source"></span></div>
      </div>
    </div>
  </div>

  <div class="panel" id="countdown-panel">
    <span id="countdown-label"><span class="fit" id="countdown-label-text">Vaktine Kalan Süre</span></span>
    <span id="countdown">--:--:--</span>
  </div>
</div>
<script id="data-loader">
  // Always the newest settings and prayer times, never a cached copy, so a
  // saved change shows as soon as the page is (re)loaded.
  document.write('<script src="settings.js?v=' + new Date().getTime() + '"><\/script>');
  document.write('<script src="prayer-times.js?v=' + new Date().getTime() + '"><\/script>');
</script>
<script src="app.js"></script>
</body>
</html>
